 #246b5510}.search i{position:absolute;left:12px;top:10px;color:#8e9b93;font-style:normal}.select{padding:10px 30px 10px 11px;border:1px solid var(--line);background:#fff;border-radius:9px;color:#53635a;outline:none}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}thead{background:#fafbf9}th{text-align:left;padding:11px 20px;font-size:10px;letter-spacing:.07em;color:#8a968e;font-weight:600;border-top:1px solid #f0f2ee;border-bottom:1px solid #f0f2ee}td{padding:14px 20px;border-bottom:1px solid #f0f2ee;vertical-align:middle;font-size:12px}tbody tr:hover{background:#fcfdfb}tbody tr:last-child td{border-bottom:0}.item-cell{display:flex;align-items:center;gap:11px;min-width:230px}.item-art{height:37px;width:37px;border-radius:11px;background:#edf3ed;color:#40705b;display:grid;place-items:center;font-size:16px;flex-shrink:0}.item-name{font-size:12px;font-weight:600;color:#30423a}.item-sub{font-size:10px;color:#9aa39d;margin-top:4px}.code{color:#758078;font-size:11px}.category{background:#f2f5f0;border-radius:20px;color:#637266;padding:5px 9px;font-size:10px;white-space:nowrap}.stock{font-weight:600}.status{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:600;border-radius:20px;padding:5px 9px;white-space:nowrap}.status:before{content:'';width:6px;height:6px;background:currentColor;border-radius:50%}.status.ready{background:#eaf4ed;color:#3b835d}.status.borrowed{background:#fff2e8;color:#b8733d}.status.service{background:#f1eef9;color:#7762a8}.row-actions{display:flex;gap:5px}.icon-btn{border:0;background:none;color:#8b978f;border-radius:7px;width:27px;height:27px}.icon-btn:hover{background:#edf3ed;color:var(--green)}.pagination{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;border-top:1px solid #f0f2ee;color:#89948d;font-size:11px}.pages{display:flex;gap:5px}.page{border:1px solid var(--line);background:#fff;border-radius:7px;min-width:28px;height:28px;color:#78847d;font-size:11px}.page.active{background:var(--green);color:#fff;border-color:var(--green)}.empty{padding:42px;text-align:center;color:#8c9890}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#203b32;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow);transition:.25s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}dialog{border:0;padding:0;border-radius:18px;width:min(500px,calc(100% - 28px));box-shadow:0 24px 80px #10231938;color:var(--ink)}dialog::backdrop{background:#16241f66;backdrop-filter:blur(2px)}.modal-head{padding:21px 23px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:17px;margin:0}.modal-body{padding:20px 23px 24px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#66766c;font-weight:600}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;outline:none;background:#fff}.field input:focus,.field select:focus{border-color:#84a994;box-shadow:0 0 0 3px #246b5510}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.notice{background:#f5f7f4;padding:11px 13px;border-radius:9px;font-size:11px;color:#77857c;line-height:1.7;margin-bottom:17px}.bottom-mobile{display:none}.item-art.photo{width:54px;height:46px;border:0;padding:2px;background:#f3f5f2;overflow:hidden;cursor:zoom-in}.item-art.photo img{width:100%;height:100%;object-fit:contain}.photo-dialog{width:min(760px,calc(100% - 28px))}.photo-large{display:block;width:100%;height:min(68vh,650px);object-fit:contain;background:#f7f8f6}.photo-caption{padding:12px 20px;color:#66766c;font-size:12px}@media(max-width:1000px){.sidebar{width:205px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.search input{width:180px}}@media(max-width:720px){.sidebar{width:65px;padding:18p <body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">教</div><div class="brand-text"><div class="brand-name">教研管理台</div><div class="brand-sub">臨床教學資源中心</div></div></div>
    <div class="nav-label">工作空間</div>
    <nav class="nav"><button class="active" data-nav="materials"><span class="nav-icon">▤</span><span class="nav-text">教材清單</span></button><button data-nav="loans"><span class="nav-icon">↗</span><span class="nav-text">借用管理</span></button><button data-nav="categories"><span class="nav-icon">▦</span><span class="nav-text">分類總覽</span></button><button data-nav="settings"><span class="nav-icon">⚙</span><span class="nav-text">資料管理</span></button></nav>
    <div class="sidebar-bottom">教研部教材管理系統<br>臨床技能中心 · 內部使用</div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="crumb">工作空間　/　<b id="crumb">教材清單</b></div><div class="top-actions"><span class="date-chip" id="today"></span><div class="avatar">教</div></div></header>
    <section class="content">
      <div class="heading"><div><div class="eyebrow">TEACHING RESOURCE LIBRARY</div><h1 id="page-title">教材清單</h1><p id="page-desc">集中盤點臨床教學教材，掌握庫存與借用狀態。</p></div><button class="btn primary" id="add-btn">＋ 新增教材</button></div>
      <div class="metrics">
        <article class="metric"><div class="metric-head"><span>教材品項</span><span class="metric-icon">▤</span></div><div class="metric-value" id="metric-items">—</div><div class="metric-foot">資料庫中的教材總品項</div></article>
        <article class="metric"><div class="metric-head"><span>庫存數量</span><span class="metric-icon">▣</span></div><div class="metric-value" id="metric-stock">—</div><div class="metric-foot">依教材表登錄數量合計</div></article>
        <article class="metric"><div class="metric-head"><span>借出中</span><span class="metric-icon">↗</span></div><div class="metric-value" id="metric-loans">—</div><div class="metric-foot">目前正在借用的教材</div></article>
        <article class="metric"><div class="metric-head"><span>待確認資料</span><span class="metric-icon">✳</span></div><div class="metric-value" id="metric-review">—</div><div class="metric-foot">名稱待教研部核對的匯入項目</div></article>
      </div>
      <section class="panel"><div class="panel-head"><div><div class="panel-title" id="table-title">所有教材</div><div class="panel-hint" id="table-hint">資料來源：臨床技能中心教具清冊（PDF）與新增項目</div></div><div class="tools"><label class="search"><i>⌕</i><input id="search" type="search" placeholder="搜尋名稱、編號或廠牌…" aria-label="搜尋教材"></label><select class="select" id="category-filter" aria-label="分類篩選"><option value="">所有分類</option><option>臨床技能教具</option><option>新增教材</option></select><select class="select" id="status-filter" aria-label="狀態篩選"><option value="">所有狀態</option><option value="在庫">在庫</option><option value="借出中">借出中</option><option value="維護中">維護中</option></select><button class="btn small" id="export-btn">⇩ 匯出</button></div></div>
        <div class="table-wrap"><table><thead><tr><th>教材名稱</th><th>型號／編號</th><th>分類</th><th>數量</th><th>狀態</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>沒有符合條件的教材</div></div>
        <div class="pagination"><span id="result-count"></span><div class="pages"><button class="page active">1</button></div></div>
      </section>
    </section>
  </main>
</div>
<dialog id="item-dialog"><div class="modal-head"><h2 id="dialog-title">新增教材</h2><button class="icon-btn" id="close-dialog" aria-label="關閉">✕</button></div><form id="item-form" class="modal-body"><input type="hidden" id="edit-id"><div class="form-grid"><div class="field full"><label for="name">教材名稱</label><input id="name" required placeholder="例如：成人 CPR 訓練模型"></div><div class="field"><label for="model">廠牌／型號</label><input id="model" placeholder="選填"></div><div class="field"><label for="category">分類</label><select id="category"><option>臨床技能教具</option><option>新增教材</option></select></div><div class="field"><label for="quantity">數量</label><input id="quantity" type="number" min="1" value="1" required></div><div class="field"><label for="status">狀態</label><select id="status"><option>在庫</option><option>借出中</option><option>維護中</option></select></div></div><div class="modal-actions"><button type="button" class="btn" id="cancel-dialog">取消</button><button class="btn primary" type="submit">儲存教材</button></div></form></dialog>
<dialog id="loan-dialog"><div class="modal-head"><h2>登記借用</h2><button class="icon-btn" id="close-loan" aria-label="關閉">✕</button></div><form id="loan-form" class="modal-body"><div class="notice" id="loan-item-name"></div><input type="hidden" id="loan-id"><div class="form-grid"><div class="field"><label for="borrower">借用人</label><input id="borrower" required placeholder="姓名／單位"></div><div class="field"><label for="due">預計歸還日</label><input id="due" type="date" required></div></div><div class="modal-actions"><button type="button" class="btn" id="cancel-loan">取消</button><button class="btn primary">確認借出</button></div></form></dialog>
<dialog id="photo-dialog" class="photo-dialog"><div class="modal-head"><h2 id="photo-title">教具照片</h2><button class="icon-btn" id="close-photo" aria-label="關閉">✕</button></div><img id="photo-large" class="photo-large" alt="教材照片"><div id="photo-caption" class="photo-caption"></div></dialog>
<dialog id="photo-dialog" class="photo-dialog"><div class="modal-head"><h2 id="photo-title">教具照片</h2><button class="icon-btn" id="close-photo" aria-label="關閉">✕</button></div><img id="photo-large" class="photo-large" alt="教材照片"><div id="photo-caption" class="photo-caption"></div></dialog>
<div class="toast" id="toast" role="status"></div>
<script>
const seed=[
['成人氣道管理訓練模型','Laerdal VT-900',2],['氣管插管訓練模型','Laerdal 375-21001',3],['口腔照護訓練模型','Life/form LF01028U',7],['抽吸照護訓練模型','Laerdal 26005001',1],['氣切照護訓練模型','Laerdal 262-00001',1],['胸腔穿刺訓練模型','Gaumard S411',1],['導尿訓練模型','Laerdal 250000',3],['創傷處理訓練模型','Laerdal 250-00250',2],['鼻胃管置入訓練模型','Laerdal 375-10001',2],['鼻胃管置入訓練模型','Laerdal 270-00001',3],['中心靜脈導管照護模型','KOKEN LM-050',2],['基本救命術 BLS 教具','Laerdal 310055',1],['CPR 訓練模型','Prestan PP-AM-100M-MS',2],['急救照護訓練教具','Laerdal VT-400P',2],['下肢傷口訓練模型','Life/form LF01008U',2],['傷口照護訓練模型','Nasco LF01184U',2],['男性疾病診察模型','Adam,Rouilly AR303',1],['女性疾病診察模型','Adam,Rouilly AR302',1],['頭部外傷訓練模型','Laerdal 261-02001',2],['CVC 導管置入訓練模型','KYOTO KAGAKU M93B',1],['靜脈注射訓練模型','Laerdal IV Torso',1],['高擬真急救訓練模型','Laerdal Megacode Kelly',1],['電子心律訓練器','ARB-001',2],['心肺音聽診訓練模型','—',1],['除顫訓練器','Laerdal 180011',1],['嬰兒照護模型','Laerdal Baby Anne',1],['QCPR 訓練模型','Laerdal 133-01050',2],['新生兒照護模型','Nasco LF01420',1],['兒童照護模型','Gaumard S150',1],['乳房檢查模型','KYOTO KAGAKU M88',1],['直腸檢查模型','SY-10402-PRO',1],['骨盆檢查模型','Gaumard S230.40',1],['氣道處理教具','Gaumard S315',1],['肌肉注射訓練教具','3B 1019637',2],['行動訓練設備','REALITi Nasco',2],['超音波影像設備','ASUS LU700',2]
];
const STORAGE='jiaoyan-library-v1';const $=id=>document.getElementById(id);let items;
try{items=JSON.parse(localStorage.getItem(STORAGE))}catch{}if(!Array.isArray(items)){items=seed.map((x,i)=>({id:'pdf-'+String(i+1).padStart(2,'0'),name:x[0],model:x[1],category:'臨床技能教具',quantity:x[2],status:'在庫',sourceNo:i+1,review:true,borrower:'',due:''}));save()}
function save(){localStorage.setItem(STORAGE,JSON.stringify(items))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=$('search').value.trim().toLowerCase(),cat=$('category-filter').value,st=$('status-filter').value;const shown=items.filter(x=>(!q||[x.name,x.model,x.id,String(x.sourceNo??'')].some(v=>String(v||'').toLowerCase().includes(q)))&&(!cat||x.category===cat)&&(!st||x.status===st));$('rows').innerHTML=shown.map(x=>`<tr><td><div class="item-cell">${x.sourceNo?`<button class="item-art photo" data-photo="${x.sourceNo}" aria-label="查看教材照片"><img src="./assets/photos/item-${String(x.sourceNo).padStart(2,'0')}.jpg" alt=""></button>`:`<div class="item-art">＋</div>`}<div><div class="item-name">${esc(x.name)}${x.review?' <span style="color:#bd7942;font-size:9px;font-weight:500">待核對</span>':''}</div><div class="item-sub">${x.sourceNo?'PDF 清冊・項次 '+String(x.sourceNo).padStart(2,'0'):x.borrower?'借用人：'+esc(x.borrower):'教研部教材'}</div></div></div></td><td class="code">${esc(x.model||'—')}</td><td><span class="category">${esc(x.category)}</span></td><td class="stock">${x.quantity} 件</td><td><span class="status ${x.status==='在庫'?'ready':x.status==='借出中'?'borrowed':'service'}">${esc(x.status)}</span></td><td><div class="row-actions"><button class="icon-btn" title="編輯" aria-label="編輯" data-edit="${esc(x.id)}">✎</button>${x.status==='借出中'?`<button class="icon-btn" title="登記歸還" aria-label="登記歸還" data-return="${esc(x.id)}">↙</button>`:`<button class="icon-btn" title="登記借用" aria-label="登記借用" data-loan="${esc(x.id)}">↗</button>`}<button class="icon-btn" title="刪除" aria-label="刪除" data-delete="${esc(x.id)}">×</button></div></td></tr>`).join('');$('empty').hidden=shown.length>0;$('result-count').textContent=`顯示 ${shown.length} 項，共 ${items.length} 項教材`;$('metric-items').textContent=items.length;$('metric-stock').textContent=items.reduce((a,x)=>a+(Number(x.quantity)||0),0);$('metric-loans').textContent=items.filter(x=>x.status==='借出中').length;$('metric-review').textContent=items.filter(x=>x.review).length}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}
function newItem(){ $('item-form').reset();$('edit-id').value='';$('dialog-title').textContent='新增教材';$('quantity').value=1;$('item-dialog').showModal() }
function editItem(id){const x=items.find(a=>a.id===id);if(!x)return;$('item-form').reset();$('edit-id').value=id;$('dialog-title').textContent='編輯教材';$('name').value=x.name;$('model').value=x.model||'';$('category').value=x.category;$('quantity').value=x.quantity;$('status').value=x.status;$('item-dialog').showModal()}
$('item-form').addEventListener('submit',e=>{e.preventDefault();const id=$('edit-id').value;const x={name:$('name').value.trim(),model:$('model').value.trim()||'—',category:$('category').value,quantity:Number($('quantity').value),status:$('status').value,review:false};if(id){Object.assign(items.find(a=>a.id===id),x)}else items.unshift({id:'new-'+Date.now(),...x,sourceNo:null,borrower:'',due:''});save();render();$('item-dialog').close();toast(id?'教材資料已更新':'教材已新增')});
function startLoan(id){const x=items.find(a=>a.id===id);if(!x)return;$('loan-id').value=id;$('loan-item-name').textContent=`${x.name} · ${x.model}　｜　目前數量 ${x.quantity} 件`;$('borrower').value='';let d=new Date();d.setDate(d.getDate()+7);$('due').value=d.toISOString().slice(0,10);$('loan-dialog').showModal()}
$('loan-form').addEventListener('submit',e=>{e.preventDefault();const x=items.find(a=>a.id===$('loan-id').value);if(x){x.status='借出中';x.borrower=$('borrower').value.trim();x.due=$('due').value;save();render();$('loan-dialog').close();toast('借用紀錄已登記')} });
document.addEventListener('click',e=>{const b=e.target.closest('[data-edit],[data-loan],[data-return],[data-delete],[data-photo]');if(!b)return;if(b.dataset.photo){const n=Number(b.dataset.photo),x=items.find(a=>Number(a.sourceNo)===n);$('photo-title').textContent=x?.name||`教具項次 ${n}`;$('photo-caption').textContent=`臨床技能中心教具清冊 · PDF 項次 ${String(n).padStart(2,'0')}　｜　${x?.model||''}`;$('photo-large').src=`./assets/photos/item-${String(n).padStart(2,'0')}.jpg`;$('photo-large').alt=x?.name||`教具項次 ${n}`;$('photo-dialog').showModal()}if(b.dataset.edit)editItem(b.dataset.edit);if(b.dataset.loan)startLoan(b.dataset.loan);if(b.dataset.return){const x=items.find(a=>a.id===b.dataset.return);if(x){x.status='在庫';x.borrower='';x.due='';save();render();toast('已登記歸還')}}if(b.dataset.delete){const x=items.find(a=>a.id===b.dataset.delete);if(x&&confirm(`確定刪除「${x.name}」？`)){items=items.filter(a=>a.id!==x.id);save();render();toast('教材已刪除')}}});
['search','category-filter','status-filter'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('add-btn').onclick=newItem;$('close-dialog').onclick=$('cancel-dialog').onclick=()=>$('item-dialog').close();$('close-loan').onclick=$('cancel-loan').onclick=()=>$('loan-dialog').close();$('close-photo').onclick=()=>$('photo-dialog').close();
$('export-btn').onclick=()=>{const headers=['教材名稱','廠牌型號','分類','數量','狀態','來源項次','借用人','預計歸還日'];const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const body=items.map(x=>[x.name,x.model,x.category,x.quantity,x.status,x.sourceNo||'',x.borrower,x.due].map(quote).join(',')).join('\r\n');const blob=new Blob(['\ufeff'+headers.map(quote).join(',')+'\r\n'+body],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='教研部教材清單.csv';a.click();URL.revokeObjectURL(a.href);toast('教材清單已匯出 CSV')};
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-nav]').forEach(n=>n.classList.remove('active'));b.classList.add('active');const views={materials:['教材清單','集中盤點臨床教學教材，掌握庫存與借用狀態。'],loans:['借用管理','查看借用中項目，登記借出與歸還。'],categories:['分類總覽','依教材類型檢視臨床教學資源。'],settings:['資料管理','管理清單資料與匯出備份。']};$('crumb').textContent=views[b.dataset.nav][0];$('page-title').textContent=views[b.dataset.nav][0];$('page-desc').textContent=views[b.dataset.nav][1];$('table-title').textContent=b.dataset.nav==='loans'?'借用紀錄':b.dataset.nav==='categories'?'教材分類':'所有教材';if(b.dataset.nav==='loans'){$('status-filter').value='借出中';render()}else{$('status-filter').value='';render()}if(b.dataset.nav==='settings')toast('資料會儲存在這個瀏覽器，可用「匯出」備份')}}));
const now=new Date();$('today').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(now);render();
</script>
</body>
</html>
